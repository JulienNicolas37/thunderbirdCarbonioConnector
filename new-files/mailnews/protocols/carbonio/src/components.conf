# Phase 1 scaffold - only registers what's implemented so far
# (CarbonioIncomingServer). Modeled after EWS's components.conf.
#
# NOT YET REGISTERED (needed before an account can be fully created and
# used end to end - see the connector repo's docs for what's pending):
#   - "@mozilla.org/messenger/carbonio-client;1" - the Rust/XPCOM bridge
#     (CarbonioIncomingServer::GetProtocolClient() already looks this
#     contract ID up via do_CreateInstance, but nothing implements it yet -
#     this is `lib.rs`'s equivalent of EWS's `XpcomEwsBridge`).
#   - "@mozilla.org/messenger/protocol/info;1?type=carbonio" - protocol
#     info (default port, account wizard integration) - CarbonioProtocolInfo,
#     not yet written.
#   - "@mozilla.org/mail/folder-factory;1?name=carbonio" - CarbonioFolder,
#     deliberately deferred (see the phase 1 conception doc for why).
#   - A message display/service contract and protocol handler for opening
#     individual messages, mirroring EWS's ExchangeService/
#     ExchangeProtocolHandler.

